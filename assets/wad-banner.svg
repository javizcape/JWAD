<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f1b2d"/>
      <stop offset="100%" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0078D6"/>
    </linearGradient>
    <linearGradient id="winbtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e6fd9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2a42" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.35"/>

  <!-- Franja de acento superior -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <!-- Icono de ventana estilo Windows -->
  <g transform="translate(64,96)">
    <rect x="0" y="0" width="120" height="120" rx="14" fill="#132038" stroke="#25406b" stroke-width="1.5"/>
    <rect x="10" y="10" width="47" height="47" rx="4" fill="url(#winbtn)"/>
    <rect x="63" y="10" width="47" height="47" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="10" y="63" width="47" height="47" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="63" y="63" width="47" height="47" rx="4" fill="url(#winbtn)"/>
  </g>

  <!-- Titulo -->
  <text x="230" y="140" font-family="Segoe UI, Consolas, monospace" font-size="54" font-weight="700" fill="#f1f5f9">
    Windows App Deployer
  </text>
  <text x="230" y="140" font-family="Segoe UI, Consolas, monospace" font-size="54" font-weight="700" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.5">
    Windows App Deployer
  </text>

  <!-- Subtitulo -->
  <text x="232" y="180" font-family="Consolas, monospace" font-size="21" fill="#9fb3c8">
    Despliegue masivo, silencioso y automatizado de software esencial &#8226; Windows x64
  </text>

  <!-- Badges tipo "pill" decorativas -->
  <g font-family="Consolas, monospace" font-size="16" font-weight="600">
    <rect x="232" y="206" width="150" height="34" rx="17" fill="#0f2a1c" stroke="#22c55e" stroke-width="1.2"/>
    <text x="307" y="228" fill="#4ade80" text-anchor="middle">MIT LICENSE</text>

    <rect x="394" y="206" width="150" height="34" rx="17" fill="#10233f" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="469" y="228" fill="#7dd3fc" text-anchor="middle">POWERSHELL</text>

    <rect x="556" y="206" width="150" height="34" rx="17" fill="#2a1a3d" stroke="#c084fc" stroke-width="1.2"/>
    <text x="631" y="228" fill="#d8b4fe" text-anchor="middle">WINGET READY</text>
  </g>

  <!-- Prompt de terminal decorativo -->
  <g transform="translate(830,60)">
    <rect x="0" y="0" width="386" height="200" rx="10" fill="#0a1220" stroke="#243350" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="6" fill="#ef4444"/>
    <circle cx="42" cy="22" r="6" fill="#eab308"/>
    <circle cx="64" cy="22" r="6" fill="#22c55e"/>
    <line x1="0" y1="38" x2="386" y2="38" stroke="#243350" stroke-width="1"/>
    <text x="18" y="70" font-family="Consolas, monospace" font-size="15" fill="#7dd3fc">PS C:\&gt; irm .../install-apps.ps1 &#124; iex</text>
    <text x="18" y="98" font-family="Consolas, monospace" font-size="14" fill="#4ade80">[OK] Validando arquitectura AMD64</text>
    <text x="18" y="122" font-family="Consolas, monospace" font-size="14" fill="#4ade80">[OK] Elevando privilegios (UAC)</text>
    <text x="18" y="146" font-family="Consolas, monospace" font-size="14" fill="#4ade80">[OK] Instalando vía Winget...</text>
    <text x="18" y="170" font-family="Consolas, monospace" font-size="14" fill="#facc15">[..] Generando Reporte_Despliegue.json</text>
  </g>
</svg>
