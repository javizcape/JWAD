<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020817"/><stop offset=".55" stop-color="#071426"/><stop offset="1" stop-color="#030b18"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1d9bf0"/><stop offset="1" stop-color="#38d9ff"/>
  </linearGradient>
  <linearGradient id="blue2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#39c5ff"/><stop offset="1" stop-color="#0757d8"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#17304e" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#1c6db5"/>
  </pattern>
</defs>

<!-- Background -->
<rect width="1280" height="320" fill="url(#bg)"/>
<rect width="1280" height="320" fill="url(#grid)" opacity=".18"/>
<rect x="0" y="0" width="220" height="105" fill="url(#dots)" opacity=".35"/>
<rect x="1080" y="0" width="200" height="140" fill="url(#dots)" opacity=".32"/>

<!-- Technical diagonal architecture -->
<path d="M920 0H1050L790 320H660Z" fill="#06254a" opacity=".55"/>
<path d="M1115 0H1170L910 320H855Z" fill="url(#blue2)" opacity=".9"/>
<path d="M1190 0H1220L960 320H930Z" fill="#0b3c8b" opacity=".75"/>
<path d="M0 302H610L590 320H0Z" fill="#0a4d91" opacity=".65"/>
<path d="M0 0H8V320H0Z" fill="url(#blue)"/>

<!-- Left brand mark -->
<g transform="translate(48 38)">
  <path d="M0 43L38 0H58L27 35H52L18 72H0L24 43Z" fill="url(#blue2)"/>
  <path d="M30 43L67 0H83L51 35H73L43 72H26L48 43Z" fill="#38d9ff"/>
</g>
<text x="145" y="83" font-family="Segoe UI, Arial, sans-serif" font-size="39" font-weight="800" letter-spacing="2" fill="#f5f9ff">JAVIZCAPE</text>

<!-- Main title -->
<text x="48" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="33" font-weight="800" letter-spacing="1.2" fill="#ffffff">WINDOWS APP DEPLOYER</text>
<rect x="48" y="146" width="545" height="3" rx="2" fill="url(#blue)"/>
<path d="M575 146h28l-10 10h-28Z" fill="#1d9bf0"/>
<path d="M612 146h18l-10 10h-18Z" fill="#38d9ff"/>

<!-- Description -->
<text x="48" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#39cfff" letter-spacing=".8">AUTOMATIZA · DESPLIEGA · OPTIMIZA</text>
<text x="48" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#c5d5e5">Instalación y administración silenciosa de aplicaciones</text>
<text x="48" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#c5d5e5">Windows mediante PowerShell y fuentes oficiales.</text>

<!-- Feature cards -->
<g font-family="Segoe UI, Arial, sans-serif">
  <g transform="translate(48 246)">
    <rect width="126" height="49" rx="7" fill="#07182b" stroke="#164e7a"/>
    <circle cx="20" cy="24" r="11" fill="none" stroke="#28bfff" stroke-width="2"/>
    <path d="M15 24l4 4 8-9" fill="none" stroke="#28bfff" stroke-width="2"/>
    <text x="39" y="21" font-size="10.5" font-weight="800" fill="#fff">AUTOMATIZADO</text><text x="39" y="36" font-size="9" fill="#8eb4d2">SIN INTERVENCIÓN</text>
  </g>
  <g transform="translate(184 246)">
    <rect width="126" height="49" rx="7" fill="#07182b" stroke="#164e7a"/>
    <path d="M20 12v22M12 26l8 8 8-8" fill="none" stroke="#28bfff" stroke-width="2.5"/>
    <text x="39" y="21" font-size="10.5" font-weight="800" fill="#fff">DESPLIEGUE</text><text x="39" y="36" font-size="9" fill="#8eb4d2">SILENCIOSO</text>
  </g>
  <g transform="translate(320 246)">
    <rect width="126" height="49" rx="7" fill="#07182b" stroke="#164e7a"/>
    <path d="M20 11l10 4v8c0 7-5 12-10 14-5-2-10-7-10-14v-8z" fill="none" stroke="#28bfff" stroke-width="2"/>
    <path d="M15 23l4 4 7-8" fill="none" stroke="#42e87a" stroke-width="2"/>
    <text x="39" y="21" font-size="10.5" font-weight="800" fill="#fff">CONFIABLE</text><text x="39" y="36" font-size="9" fill="#8eb4d2">Y SEGURO</text>
  </g>
  <g transform="translate(456 246)">
    <rect width="126" height="49" rx="7" fill="#07182b" stroke="#164e7a"/>
    <path d="M20 12v24M12 24h16" stroke="#28bfff" stroke-width="2"/>
    <path d="M20 12a12 12 0 0 1 12 12" fill="none" stroke="#28bfff" stroke-width="2"/>
    <text x="39" y="21" font-size="10.5" font-weight="800" fill="#fff">EFICIENTE</text><text x="39" y="36" font-size="9" fill="#8eb4d2">Y RÁPIDO</text>
  </g>
</g>

<!-- Terminal panel -->
<g transform="translate(690 43)">
  <rect x="10" y="10" width="515" height="226" rx="15" fill="#07111e" stroke="#0a5aa2" stroke-width="2" opacity=".7" filter="url(#glow)"/>
  <rect width="515" height="226" rx="15" fill="#060d18" stroke="#285176" stroke-width="1.5"/>
  <rect width="515" height="37" rx="15" fill="#0b1727"/>
  <rect y="22" width="515" height="15" fill="#0b1727"/>
  <circle cx="22" cy="19" r="5" fill="#ef4444"/><circle cx="39" cy="19" r="5" fill="#eab308"/><circle cx="56" cy="19" r="5" fill="#22c55e"/>
  <text x="78" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#d6e4f2">Windows App Deployer</text>
  <text x="20" y="65" font-family="Consolas, monospace" font-size="12.5" fill="#38d9ff">PS C:\&gt; .\install-apps.ps1</text>
  <text x="20" y="89" font-family="Consolas, monospace" font-size="12" fill="#4ade80">[OK] Validando arquitectura AMD64</text>
  <text x="20" y="112" font-family="Consolas, monospace" font-size="12" fill="#4ade80">[OK] Elevando privilegios (UAC)</text>
  <text x="20" y="135" font-family="Consolas, monospace" font-size="12" fill="#4ade80">[OK] Instalando vía Winget...</text>
  <text x="20" y="158" font-family="Consolas, monospace" font-size="12" fill="#facc15">[..] Generando reporte de despliegue</text>
  <text x="20" y="181" font-family="Consolas, monospace" font-size="12" fill="#a5b4fc">[INFO] 11 aplicaciones procesadas</text>
  <text x="20" y="204" font-family="Consolas, monospace" font-size="12" fill="#4ade80">[DONE] Despliegue completado ✓</text>
</g>

<!-- PowerShell cube / terminal emblem -->
<g transform="translate(1210 63)">
  <polygon points="0,22 38,0 76,22 76,66 38,88 0,66" fill="#07182b" stroke="#28cfff" stroke-width="2"/>
  <path d="M19 31l14 12-14 12M39 57h18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>

