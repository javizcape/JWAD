  <rect x="132" y="0" width="132" height="25" rx="12" fill="#0b2138" stroke="#38bdf8"/>
  <text x="198" y="17" text-anchor="middle" font-size="10" font-weight="800" fill="#7dd3fc">POWERSHELL</text>
  <rect x="276" y="0" width="132" height="25" rx="12" fill="#18133a" stroke="#a78bfa"/>
  <text x="342" y="17" text-anchor="middle" font-size="10" font-weight="800" fill="#c4b5fd">WINGET READY</text>
  <rect x="420" y="0" width="150" height="25" rx="12" fill="#0b2138" stroke="#38bdf8"/>
  <text x="495" y="17" text-anchor="middle" font-size="10" font-weight="800" fill="#7dd3fc">PRODUCTION READY</text>
</g>

<!-- Bottom luminous line -->
<rect x="0" y="316" width="1280" height="4" fill="url(#blue)"/>
</svg>